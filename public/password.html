<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/inicioSesion.css">
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-50x50.png" sizes="32x32" />
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" />
    <script src="https://kit.fontawesome.com/cdfb1fb9bd.js" crossorigin="anonymous"></script>
    <title>Conociendo Las Flores - Cambiar Contraseña</title>
</head>
<body>
    <header class="header-container">
    <div class="header-title-container">
        <img src="/images/Logo-Modernizacion-Color.png" alt="Logo Master Quiz" class="header-logo logo-light-theme">
        <img src="/images/Logo-muni-BLANCO.png" alt="Logo Master Quiz" class="header-logo logo-dark-theme">
        <strong>Conociendo Las Flores</strong>
    </div>
    
    <a href="/index.html" class="a-icono">
        <i class="fa-solid fa-right-from-bracket fa-xl"></i>
    </a>
    </header>
    <main>
        <form id="formulario" method="POST" class="form-container">
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" required>
            <label for="current_password">Ingrese su contraseña actual:</label>
            <input id="current_password" type="password" name="current_password" required>
            <label for="new_password">Ingrese su nueva contraseña:</label>
            <input id="new_password" type="password" name="new_password" required>
            <button type="submit" class="btn-principal">Cambiar contraseña</button>
        </form>
        <div id="error-message" style="color: red; margin-top: 10px;"></div>
    </main>
    <footer>
        <span>Texto</span>
    </footer>
    <script src="/js/theme.js"></script>
    <script src="/js/cambiarPassword.js"></script>
</body>
</html>
