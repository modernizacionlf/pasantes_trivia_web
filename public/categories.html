<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-50x50.png" sizes="32x32" />
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" />
    <script src="https://kit.fontawesome.com/cdfb1fb9bd.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/categories.css">
    <title>Conociendo Las Flores - Categorías</title>
</head>
<body>
    <header class="header-container">
    <div class="header-title-container">
        <img src="/images/Logo-Modernizacion-Color.png" alt="Logo Master Quiz" class="header-logo logo-light-theme">
        <img src="/images/Logo-muni-BLANCO.png" alt="Logo Master Quiz" class="header-logo logo-dark-theme">
        <strong>Conociendo Las Flores</strong>
    </div>        
    </header>
    <main>
        <section>
            <div class="categoria-text">Seleccioná una categoria para responder:</div>
            <div id="categories-container" class="icons-grid">
            </div>
            <div class="random">
                <div class="random-text">¿No te decidis? ¡Elegí una categoria aleatoria!</div>
                <button id="btn-aleatoria" class="btn-principal">Elegir Categoría Aleatoria</button>
            </div>
        </section>
    </main>
    
    <footer>
        <span>&copy; 2025 Municipalidad de Las Flores.</span>
    </footer>

<script src="/js/theme.js"></script>
<script src="/js/categories.js"></script>
</body>
</html>
