<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/results.css">
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-50x50.png" sizes="32x32" />
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" />
    <script src="https://kit.fontawesome.com/cdfb1fb9bd.js" crossorigin="anonymous"></script>
    <title>Conociendo Las Flores - Ranking General</title>
    <link rel="icon" href="/images/trofeo.ico" type="image/x-icon">
</head>
<body>
    <header class="header-container">
    <div class="header-title-container">
        <img src="/images/Logo-Modernizacion-Color.png" alt="Logo Master Quiz" class="header-logo logo-light-theme">
        <img src="/images/Logo-muni-BLANCO.png" alt="Logo Master Quiz" class="header-logo logo-dark-theme">
        <strong>Conociendo Las Flores</strong>
    </div>

    <div>
        <button id="theme-toggle-button" title="Cambiar tema">
            <i class="fa-solid fa-moon"></i>
        </button>
        <a href="/menu.html" class="a-icono" title="Volver al Menú">
            <i class="fa-solid fa-house fa-xl"></i>
        </a>
    </div>
    </header>

    <main>
        <div class="results-container">
            <h2 class="results-title">Ranking de Jugadores</h2>
            <section class="leaderboard-card">
                <h3> <i class="fa-solid fa-trophy"></i> TOP 5 JUGADORES</h3>
                <div id="loader" class="loader">Cargando...</div>
                <table id="ranking-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>Puesto</th>
                            <th>Jugador</th>
                            <th>Puntuación</th>
                            <th>Correctas</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body">
                    </tbody>
                </table>
                <p id="error-message" style="color: var(--color-error); display: none;"></p>
            </section>
            <a href="/register.html" class="btn-principal">Jugar Ahora</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2025 Municipalidad de Las Flores.</span>
    </footer>

    <script src="/js/theme.js"></script>
    <!-- Usamos el mismo script que results.js porque la lógica es idéntica -->
    <script src="/js/results.js"></script> 
</body>
</html>
