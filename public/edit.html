<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/editar.css">
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-50x50.png" sizes="32x32" />
    <link rel="icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="https://lasflores.gob.ar/wp-content/uploads/2020/09/favicon-1-250x195.png" />
    <script src="https://kit.fontawesome.com/cdfb1fb9bd.js" crossorigin="anonymous"></script>
    <title>Conociendo Las Flores - Panel de Fiscalización</title>
</head>
<body>
    <header class="header-container">
    <div class="header-title-container">
        <img src="/images/Logo-Modernizacion-Color.png" alt="Logo Master Quiz" class="header-logo logo-light-theme">
        <img src="/images/Logo-muni-BLANCO.png" alt="Logo Master Quiz" class="header-logo logo-dark-theme">
        <strong>Conociendo Las Flores</strong>
    </div>

    <i class="fa-right-from-bracket fa-xl" id="logout-btn" onclick="if(confirm('¿Cerrar sesión?')) logout()"></i>
    </header>
    <main>
        <p>Editar Pregunta</p>
    <div id="editQuestionsSection" class="edit-section">
        <select id="questionSelect">
            <option value="">Selecciona una pregunta para editar</option>
        </select>
        <div id="answersEditContainer">
        </div>
        <button id="saveChangesBtn">Realizar cambios</button>
        <button id="backBtn">Volver al Cuestionario</button>
    </div>
    </main>
    <footer>
        <span>Texto</span>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/logout.js"></script>
    <script src="/js/editar.js"></script>
</body>
</html>
