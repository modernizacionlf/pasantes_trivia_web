<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/results.css">
    <script src="https://kit.fontawesome.com/cdfb1fb9bd.js" crossorigin="anonymous"></script>
    <title>Conociendo Las Flores - Ranking Final</title>
</head>
<body>
    <header class="header-container">
    <div class="header-title-container">
        <img src="/images/Logo-Modernizacion-Color lf.png" alt="Logo Master Quiz" class="header-logo logo-light-theme">
        <img src="/images/Logo-muni-BLANCO.png" alt="Logo Master Quiz" class="header-logo logo-dark-theme">
        <strong>Conociendo Las Flores</strong>
    </div>
    
    <div style="display: flex; align-items: center;">
        <a href="/index.html" class="a-icono">
            <i class="fa-solid fa-house fa-xl"></i>
        </a>
    </div>
    </header>

    <main>
        <div class="results-container">
            
            <h2 class="results-title">¡Trivia Terminada!</h2>
            
            <section class="leaderboard-card">
                <h3> <i class="fa-solid fa-trophy"></i> TOP 5 JUGADORES</h3>
                <div id="loader" class="loader">Cargando...</div>
                <table id="ranking-table" style="display:none;">
                    <thead>
                        <tr>
                            <th>Puesto</th>
                            <th>Jugador</th>
                            <th>Puntuación</th>
                            <th>Correctas</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body">
                    </tbody>
                </table>
                <p id="error-message" style="color: var(--color-error); display: none;"></p>
            </section>

            <div class="credits-section">
                <p class="gracias-mensaje">¡Gracias por Jugar!</p>
                <p class="desarrollado-por">
                    App hecha por Pasantes de Técnica Informática:<br>
                    <strong>Santiago Petreigne</strong> y <strong>Nicolás Gonzalia</strong>
                </p>
            </div>

            <a href="/categories.html" class="btn-principal">Volver a Jugar</a>
        </div>
    </main>

    <footer>
        <span>&copy; 2025 Municipalidad de Las Flores.</span>
    </footer>

    <script src="/js/theme.js"></script>
    <script src="/js/results.js"></script>
</body>
</html>
